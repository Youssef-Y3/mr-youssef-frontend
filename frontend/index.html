<style>

  /* Skeleton shimmer */
  @keyframes shimmer { 0% { background-position: -200% 0 } 100% { background-position: 200% 0 } }
  .skeleton {
    background: linear-gradient(90deg, #e8e2d4 0%, #f2ede2 40%, #e8e2d4 80%);
    background-size: 200% 100%;
    animation: shimmer 1.6s infinite linear;
    border-radius: .75rem;
  }

  /* Watermark for video */
  @keyframes wm-drift {
    0%   { transform: translate(0,0); }
    25%  { transform: translate(30px,20px); }
    50%  { transform: translate(-20px,40px); }
    75%  { transform: translate(-30px,-15px); }
    100% { transform: translate(0,0); }
  }
  .watermark {
    position: absolute; inset: 0; pointer-events: none;
    display: flex; align-items: center; justify-content: center;
    font-family: 'Cairo', sans-serif; font-weight: 800;
    color: rgba(255,255,255,.22);
    font-size: clamp(1rem, 2.5vw, 1.5rem);
    text-shadow: 0 2px 6px rgba(0,0,0,.5);
    animation: wm-drift 20s ease-in-out infinite;
    letter-spacing: .04em;
  }

  /* Custom scrollbar */
  ::-webkit-scrollbar { width: 10px; height: 10px; }
  ::-webkit-scrollbar-track { background: transparent; }
  ::-webkit-scrollbar-thumb { background: #c9a22755; border-radius: 999px; }
  ::-webkit-scrollbar-thumb:hover { background: #c9a22799; }

  /* focus */
  input:focus, textarea:focus, select:focus, button:focus-visible {

    outline-offset: 2px;
  }
  input, textarea, select {

  /* range confetti overrides handled by canvas */

  /* Marquee for banner */
  @keyframes marquee { 0% { transform: translateX(0);} 100% { transform: translateX(-50%);} }
  .marquee-track { animation: marquee 40s linear infinite; }

  /* Card hover lift */
  .card-hover { transition: transform .3s cubic-bezier(.2,.8,.2,1), box-shadow .3s ease; }
  .card-hover:hover { transform: translateY(-4px); box-shadow: 0 24px 60px -20px rgba(15,81,50,.28); }

  /* Route transition wrapper */
  .route-enter { opacity: 0; transform: translateY(8px); }
  .route-enter-active { opacity: 1; transform: translateY(0); transition: all .35s cubic-bezier(.2,.8,.2,1); }

  /* Utility */
  .divider-gold { height: 3px; width: 60px; background: linear-gradient(90deg,#c9a227,#eec853); border-radius: 999px; }

  /* Toast animation */
  @keyframes toast-in { from { opacity:0; transform: translateY(-12px);} to { opacity:1; transform: translateY(0);} }
  .toast-in { animation: toast-in .3s cubic-bezier(.2,.8,.2,1); }

  /* Stagger reveal - use animation not transition; content is visible by default */
  @keyframes stagger-rise { from { opacity: 0; transform: translateY(24px);} to { opacity: 1; transform: translateY(0);} }
  [data-stagger="in"] > .stagger-item { animation: stagger-rise .65s cubic-bezier(.2,.8,.2,1) both; }
  [data-stagger="in"] > .stagger-item:nth-child(1){animation-delay:.0s}
  [data-stagger="in"] > .stagger-item:nth-child(2){animation-delay:.08s}
  [data-stagger="in"] > .stagger-item:nth-child(3){animation-delay:.16s}
  [data-stagger="in"] > .stagger-item:nth-child(4){animation-delay:.24s}
  [data-stagger="in"] > .stagger-item:nth-child(5){animation-delay:.32s}
  [data-stagger="in"] > .stagger-item:nth-child(6){animation-delay:.40s}
  [data-stagger="in"] > .stagger-item:nth-child(7){animation-delay:.48s}
  [data-stagger="in"] > .stagger-item:nth-child(8){animation-delay:.56s}

  /* Confetti */
  #confetti-canvas { position: fixed; inset: 0; pointer-events: none; z-index: 100; }
